<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - Stackly">
  <title>404 - Page Not Found | Stackly</title>
  <link rel="icon" href="assets/images/logo.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="main" class="error-page">
    <div class="error-page__media">
      <img src="assets/images/property-01.webp" srcset="assets/images/property-01-sm.webp 720w, assets/images/property-01.webp 1200w" sizes="100vw" alt="">
    </div>
    <div class="error-page__shade"></div>

    <div class="container text-center error-page__content">
      <div class="error-page__card">
        <a class="error-page__logo" href="index.html" aria-label="Stackly home">
          <img src="assets/images/logo.webp" alt="Stackly" width="1200" height="493">
        </a>
        <div class="error-page__code">404</div>
        <h1>Page not <em>found</em></h1>
        <p class="error-page__lead">
          The page you're looking for doesn't exist or has been moved. Let's get you back on track.
        </p>
        <div class="error-page__actions">
          <a class="btn btn-ink" href="index.html" data-magnetic>
            Back to home
            <svg class="icon"><use href="#icon-arrow"/></svg>
          </a>
          <button class="btn btn-accent" type="button" onclick="history.back()" data-magnetic>
            Go Back
            <svg class="icon"><use href="#icon-arrow"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
